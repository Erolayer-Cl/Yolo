<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de rescate</title>
<!-- Sin dependencias externas: funciona sin internet. El mapa de calles
     (OpenStreetMap) es opcional y sí necesita internet. -->
<style>
  :root {
    color-scheme: dark;
    /* Página: siempre oscura. */
    --bg: #0d0f13; --panel: #171a20; --text: #e7eaf0; --muted: #98a1b1; --line: #2a2f38;
    --chip: #222730; --sel: #ffffff; --ok: #2e9e57; --warn: #c48a1c; --bad: #d64541;
    --person-t: #ff6a5c; --approx-t: #ffa03a; --drone-t: #b49aff;   /* texto sobre fondo oscuro */
    /* Mapa: claro, como siempre, para que se lea igual que antes. */
    --map: #eceff3; --grid: rgba(60, 72, 92, .16); --grid-axis: rgba(60, 72, 92, .45);
    --map-panel: #ffffff; --map-text: #1c2330; --map-muted: #657084; --map-sel: #111827;
    --person: #d33427; --approx: #e07a10; --home: #1b8a3c; --trail: #3b7ddd; --drone: #6d3fd8;
    --manual: #1f5fe0; --manual-t: #6ea2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  #status { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
            color: #fff; background: var(--muted); }
  #status.ok { background: var(--ok); } #status.warn { background: var(--warn); }
  #status.bad { background: var(--bad); }
  #drone { color: var(--muted); font-variant-numeric: tabular-nums; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
           padding: 10px 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 8px 14px; }
  .stat .v { font-size: 28px; font-weight: 750; line-height: 1.1;
             font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat.total .v { color: var(--text); } .stat.ubic .v { color: var(--person-t); }
  .stat.aprox .v { color: var(--approx-t); } .stat.view .v { color: var(--drone-t); }

  main { flex: 1; display: flex; gap: 10px; padding: 0 16px 16px; min-height: 0; }
  #mapwrap { position: relative; flex: 1; min-width: 0; border: 1px solid var(--line);
             border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab;
           background: var(--map); }
  canvas:active { cursor: grabbing; }
  .tools { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column;
           gap: 6px; }
  .tools button, .bar button, .bar a { height: 34px; padding: 0 12px; border: 1px solid var(--line);
           border-radius: 8px; background: var(--panel); color: var(--text);
           font: 600 13px system-ui, sans-serif; cursor: pointer; text-decoration: none;
           display: inline-flex; align-items: center; }
  .tools button { min-width: 40px; justify-content: center; }
  .tools button.on { background: var(--drone); border-color: var(--drone); color: #fff; }
  #cursor { position: absolute; left: 10px; bottom: 44px; font: 12px ui-monospace, Consolas, monospace;
            background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
            padding: 3px 8px; color: var(--muted); display: none; }
  #attrib { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: var(--muted);
            background: var(--panel); padding: 1px 6px; border-radius: 4px; display: none; }
  #attrib a { color: inherit; }
  #note { position: absolute; left: 10px; top: 10px; max-width: 60%; font-size: 12px;
          color: var(--muted); background: var(--panel); padding: 4px 8px; border-radius: 6px;
          border: 1px solid var(--line); display: none; }

  aside { width: 640px; display: flex; flex-direction: column; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
         border-bottom: 1px solid var(--line); }
  .bar h2 { font-size: 15px; margin: 0 auto 0 0; }
  .tablewrap { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 12px;
       color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line);
       white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.mono { font: 13px ui-monospace, "Cascadia Mono", Consolas, monospace; }
  td.num { text-align: right; }
  td.muted, .muted { color: var(--muted); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--chip); }
  tbody tr.sel { background: var(--chip); box-shadow: inset 4px 0 0 var(--sel); }
  tbody tr.new { animation: flash 1.2s ease-in-out 4; }
  @keyframes flash { 50% { background: color-mix(in srgb, var(--person) 22%, transparent); } }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; color: #fff; }
  .badge.ubic { background: var(--person); } .badge.aprox { background: var(--approx); }
  .badge.manual { background: var(--manual); }
  #bMark { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--manual);
           background: var(--manual); color: #fff; font: 700 14px system-ui, sans-serif;
           cursor: pointer; }
  #bMark:disabled { opacity: .45; cursor: not-allowed; }
  #bDel { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #c0392b;
          background: transparent; color: #c0392b; font-weight: 600; cursor: pointer; }
  #bDel:disabled { opacity: .45; cursor: not-allowed; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
           max-width: 90%; padding: 8px 14px; border-radius: 8px; font-weight: 600;
           background: var(--panel); color: var(--text); border: 1px solid var(--line);
           box-shadow: 0 4px 16px rgba(0,0,0,.35); display: none; }
  #toast.bad { border-color: var(--bad); color: #ffb4b0; }
  td button { font: 600 12px system-ui, sans-serif; padding: 3px 8px; border-radius: 6px;
              border: 1px solid var(--line); background: var(--panel); color: var(--text);
              cursor: pointer; }
  .empty td { color: var(--muted); padding: 24px 12px; text-align: center; white-space: normal; }

  @media (max-width: 1200px) {
    main { flex-direction: column; }
    #mapwrap { flex: none; height: 55vh; }
    aside { width: auto; flex: none; max-height: none; }
    .tablewrap { overflow-x: auto; }
  }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    main { padding: 0 8px 8px; } .stats { padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Mapa de rescate</h1>
  <span id="status">Conectando…</span>
  <span id="drone">Dron: sin datos</span>
  <button id="bMark" disabled title="Agregar una marca en la posición del dron AHORA (tecla M). Solo marca el mapa: no mueve el dron.">Marcar aquí</button>
  <button id="bDel" disabled title="Borrar el punto elegido (tocarlo en el mapa o en la tabla), p. ej. una falsa alarma (tecla Supr)">Borrar punto</button>
</header>
<section class="stats" aria-label="Conteo de personas">
  <div class="stat total"><div class="v" id="nTotal">0</div><div class="k">Personas vistas</div></div>
  <div class="stat ubic"><div class="v" id="nUbic">0</div><div class="k">Con coordenadas</div></div>
  <div class="stat aprox"><div class="v" id="nAprox">0</div><div class="k">Aproximadas</div></div>
  <div class="stat view"><div class="v" id="nView">–</div><div class="k">En cámara ahora</div></div>
</section>
<main>
  <div id="mapwrap">
    <canvas id="map" aria-label="Mapa GPS con el recorrido del dron y las personas encontradas"></canvas>
    <div id="note"></div>
    <div id="cursor"></div>
    <div id="toast" role="status"></div>
    <div class="tools">
      <button id="bFollow" class="on" title="Centrar el mapa en el dron">Seguir dron</button>
      <button id="bFit" title="Ver todo el recorrido y las personas">Ver todo</button>
      <button id="bIn" title="Acercar">+</button>
      <button id="bOut" title="Alejar">−</button>
      <button id="bOsm" title="Mapa de calles de OpenStreetMap (necesita internet)">Calles</button>
    </div>
    <div id="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
  </div>
  <aside>
    <div class="bar">
      <h2>Coordenadas</h2>
      <button id="bCopyAll" title="Copiar la tabla para pegarla en una planilla o un mensaje">Copiar tabla</button>
      <a href="/personas.csv" download>CSV</a>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>#</th><th>Estado</th><th>Latitud</th><th>Longitud</th><th>Error</th>
          <th>Desde el dron</th><th>Hora</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </aside>
</main>
<script>
'use strict';
const R = 6371008.8;                         // mismo radio que trail.py
const DEG = Math.PI / 180;
const $ = id => document.getElementById(id);
const cv = $('map'), ctx = cv.getContext('2d');

let state = null, live = null, home = null;
let view = { n: 0, e: 0, s: 2 };            // centro (m desde home) y escala (px/m)
let W = 0, H = 0;
let follow = true, fitted = false, osm = false, selected = null;
let lastLiveOk = 0, lastStateOk = 0, tileFailed = false, gotState = false;
let lastRows = '';
const known = new Set(), fresh = new Map();  // id -> instante en que apareció

try { osm = localStorage.getItem('mapa_osm') === '1'; } catch (e) {}

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------------------------------------------------------------- geometría
function ll2ne(lat, lon) {
  return [(lat - home.lat) * DEG * R, (lon - home.lon) * DEG * R * Math.cos(home.lat * DEG)];
}
function ne2ll(n, e) {
  return [home.lat + n / R / DEG, home.lon + e / (R * Math.cos(home.lat * DEG)) / DEG];
}
function toScreen(n, e) { return [W / 2 + (e - view.e) * view.s, H / 2 - (n - view.n) * view.s]; }
function toWorld(x, y) { return [view.n - (y - H / 2) / view.s, view.e + (x - W / 2) / view.s]; }
function bearing(dn, de) { return (Math.atan2(de, dn) / DEG + 360) % 360; }
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m'; }
function deg3(a) { return a.toFixed(0).padStart(3, '0') + '°'; }

// ---------------------------------------------------------------- dibujo
let drawQueued = false;
function requestDraw() {
  if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); }
}

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  requestDraw();
}

function draw() {
  drawQueued = false;
  ctx.fillStyle = css('--map');
  ctx.fillRect(0, 0, W, H);
  if (!home) {
    ctx.fillStyle = css('--map-muted');
    ctx.font = '15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Esperando el GPS del dron…', W / 2, H / 2);
    return;
  }
  if (osm) drawTiles();
  drawGrid();
  drawTrail();
  drawHome();
  drawPersons();
  drawDrone();
  drawScale();
  if (fresh.size) setTimeout(requestDraw, 60);      // anima el pulso de las nuevas
}

const STEPS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
function gridStep(minPx) { return STEPS.find(s => s * view.s >= minPx) || STEPS[STEPS.length - 1]; }

function drawGrid() {
  const step = gridStep(70);
  const [nTop, eLeft] = toWorld(0, 0), [nBot, eRight] = toWorld(W, H);
  ctx.font = '11px system-ui, sans-serif';
  ctx.lineWidth = 1;
  for (let e = Math.ceil(eLeft / step) * step; e <= eRight; e += step) {
    const [x] = toScreen(0, e);
    ctx.strokeStyle = e === 0 ? css('--grid-axis') : css('--grid');
    ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke();
    ctx.fillStyle = css('--map-muted'); ctx.textAlign = 'left';
    ctx.fillText(e === 0 ? '0' : `${Math.abs(e)} m ${e > 0 ? 'E' : 'O'}`, x + 3, H - 6);
  }
  for (let n = Math.ceil(nBot / step) * step; n <= nTop; n += step) {
    const [, y] = toScreen(n, 0);
    ctx.strokeStyle = n === 0 ? css('--grid-axis') : css('--grid');
    ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
    ctx.fillStyle = css('--map-muted'); ctx.textAlign = 'left';
    ctx.fillText(n === 0 ? '0' : `${Math.abs(n)} m ${n > 0 ? 'N' : 'S'}`, 4, y - 4);
  }
  ctx.fillStyle = css('--map-muted'); ctx.textAlign = 'center'; ctx.font = '600 12px system-ui';
  ctx.fillText('N ↑', W / 2, 16);
}

function drawTrail() {
  const pts = state ? state.trail : [];
  if (!pts || pts.length < 2) return;
  ctx.strokeStyle = css('--trail'); ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.globalAlpha = .8;
  ctx.beginPath();
  pts.forEach(([n, e], i) => { const [x, y] = toScreen(n, e); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHome() {
  const [x, y] = toScreen(0, 0);
  ctx.fillStyle = css('--home');
  ctx.beginPath(); ctx.arc(x, y, 8, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('H', x, y + 3.5);
}

function drawPersons() {
  if (!state) return;
  const now = performance.now();
  for (const p of state.persons) {
    if (!p.pos) continue;
    const [x, y] = toScreen(p.pos[0], p.pos[1]);
    if (p.manual) { drawMark(p, x, y, now); continue; }
    const color = p.ubicada ? css('--person') : css('--approx');
    if (p.ubicada && p.error_m) {                     // zona de búsqueda: 2 sigma
      const r = 2 * p.error_m * view.s;
      if (r > 6) {
        ctx.fillStyle = color; ctx.globalAlpha = .12;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
        ctx.globalAlpha = .7; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
    }
    const t0 = fresh.get(p.id);
    if (t0 !== undefined) {
      const k = ((now - t0) % 1200) / 1200;
      ctx.strokeStyle = color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 8 + 22 * k, 0, 2 * Math.PI); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (p.id === selected) {
      ctx.strokeStyle = css('--map-sel'); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, 13, 0, 2 * Math.PI); ctx.stroke();
    }
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, 2 * Math.PI);
    if (p.ubicada) {
      ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke();
    } else {                                          // aproximada: hueca
      ctx.fillStyle = css('--map-panel'); ctx.fill(); ctx.strokeStyle = color; ctx.stroke();
    }
    ctx.font = '700 12px system-ui'; ctx.textAlign = 'left';
    ctx.lineWidth = 3; ctx.strokeStyle = css('--map');
    const label = '#' + p.id + (p.ubicada ? '' : ' ?');
    ctx.strokeText(label, x + 10, y - 8); ctx.fillStyle = color; ctx.fillText(label, x + 10, y - 8);
  }
}

// Marca manual: rombo azul con su etiqueta (M1, M2...).
function drawMark(p, x, y, now) {
  const color = css('--manual');
  const t0 = fresh.get(p.id);
  if (t0 !== undefined) {
    const k = ((now - t0) % 1200) / 1200;
    ctx.strokeStyle = color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 8 + 22 * k, 0, 2 * Math.PI); ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (p.id === selected) {
    ctx.strokeStyle = css('--map-sel'); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(x, y - 9); ctx.lineTo(x + 9, y); ctx.lineTo(x, y + 9); ctx.lineTo(x - 9, y); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.font = '700 12px system-ui'; ctx.textAlign = 'left';
  ctx.lineWidth = 3; ctx.strokeStyle = css('--map');
  ctx.strokeText(p.etiqueta, x + 11, y - 8); ctx.fillStyle = color; ctx.fillText(p.etiqueta, x + 11, y - 8);
}

function drawDrone() {
  if (!live || !live.ne) return;
  const [x, y] = toScreen(live.ne[0], live.ne[1]);
  const a = (live.heading_deg ?? 0) * DEG;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(9, 10); ctx.lineTo(0, 5); ctx.lineTo(-9, 10);
  ctx.closePath();
  ctx.fillStyle = live.age_s > 3 ? css('--map-muted') : css('--drone');
  ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
}

function drawScale() {
  const target = 110, m = STEPS.slice().reverse().find(s => s * view.s <= target) || 1;
  const px = m * view.s, x = 14, y = H - 26;
  ctx.fillStyle = css('--map-panel'); ctx.globalAlpha = .85;
  ctx.fillRect(x - 6, y - 16, px + 12, 24); ctx.globalAlpha = 1;
  ctx.strokeStyle = css('--map-text'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x, y); ctx.lineTo(x + px, y); ctx.lineTo(x + px, y - 4);
  ctx.stroke();
  ctx.fillStyle = css('--map-text'); ctx.font = '600 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(fmtDist(m), x + px / 2, y - 5);
}

// --- Mapa de calles (opcional). Cada tile se pasa de lat/lon a metros con la
// misma aproximación local que el resto: en unos km el desfase es despreciable.
const tiles = new Map();
function lon2x(lon, z) { return Math.floor((lon + 180) / 360 * 2 ** z); }
function lat2y(lat, z) {
  const r = lat * DEG;
  return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z);
}
function tile2ll(x, y, z) {
  const n = Math.PI - 2 * Math.PI * y / 2 ** z;
  return [Math.atan(Math.sinh(n)) / DEG, x / 2 ** z * 360 - 180];
}
function tileImg(z, x, y) {
  const key = `${z}/${x}/${y}`;
  let img = tiles.get(key);
  if (!img) {
    if (tiles.size > 400) tiles.clear();
    img = new Image();
    img.onload = () => { tileFailed = false; updateNote(); requestDraw(); };
    img.onerror = () => { tileFailed = true; updateNote(); };
    img.src = `https://tile.openstreetmap.org/${key}.png`;
    tiles.set(key, img);
  }
  return img;
}
function drawTiles() {
  const mpp = 1 / view.s;
  const z = Math.max(2, Math.min(19, Math.round(Math.log2(156543.034 * Math.cos(home.lat * DEG) / mpp))));
  const [nT, eL] = toWorld(0, 0), [nB, eR] = toWorld(W, H);
  const [latN, lonW] = ne2ll(nT, eL), [latS, lonE] = ne2ll(nB, eR);
  const x0 = lon2x(lonW, z), x1 = lon2x(lonE, z), y0 = lat2y(latN, z), y1 = lat2y(latS, z);
  if ((x1 - x0 + 1) * (y1 - y0 + 1) > 80) return;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const img = tileImg(z, x, y);
    if (!img.complete || !img.naturalWidth) continue;
    const [la1, lo1] = tile2ll(x, y, z), [la2, lo2] = tile2ll(x + 1, y + 1, z);
    const [sx1, sy1] = toScreen(...ll2ne(la1, lo1)), [sx2, sy2] = toScreen(...ll2ne(la2, lo2));
    ctx.globalAlpha = .85;
    ctx.drawImage(img, sx1, sy1, sx2 - sx1 + .6, sy2 - sy1 + .6);
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- vista
function setFollow(on) {
  follow = on;
  $('bFollow').classList.toggle('on', on);
  if (on && live && live.ne) { view.n = live.ne[0]; view.e = live.ne[1]; requestDraw(); }
}
function zoomAt(x, y, f) {
  const [n, e] = toWorld(x, y);
  view.s = Math.min(80, Math.max(0.01, view.s * f));
  const [n2, e2] = toWorld(x, y);
  view.n += n - n2; view.e += e - e2;
  requestDraw();
}
function fitAll() {
  const pts = [[0, 0]];
  if (state) {
    state.trail.forEach(p => p && pts.push(p));
    state.persons.forEach(p => p.pos && pts.push(p.pos));
  }
  if (live && live.ne) pts.push(live.ne);
  const ns = pts.map(p => p[0]), es = pts.map(p => p[1]);
  const nMin = Math.min(...ns), nMax = Math.max(...ns), eMin = Math.min(...es), eMax = Math.max(...es);
  view.n = (nMin + nMax) / 2; view.e = (eMin + eMax) / 2;
  const span = Math.max(nMax - nMin, eMax - eMin, 40);
  view.s = Math.max(0.01, Math.min(80, 0.8 * Math.min(W, H) / span));
  requestDraw();
}
function centerOn(p) {
  if (!p.pos) return;
  setFollow(false);
  view.n = p.pos[0]; view.e = p.pos[1];
  if (view.s < 2) view.s = 4;
  requestDraw();
}
function pick(x, y) {
  if (!state) return;
  let best = null, bd = 18;
  for (const p of state.persons) {
    if (!p.pos) continue;
    const [px, py] = toScreen(p.pos[0], p.pos[1]), d = Math.hypot(px - x, py - y);
    if (d < bd) { bd = d; best = p; }
  }
  select(best ? best.id : null, true);
}
function select(id, scroll) {
  selected = id;
  $('bDel').disabled = id === null;
  document.querySelectorAll('#rows tr[data-id]').forEach(tr => tr.classList.toggle('sel', +tr.dataset.id === id));
  if (scroll && id !== null) {
    const tr = document.querySelector(`#rows tr[data-id="${id}"]`);
    if (tr) tr.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  requestDraw();
}

// Lat/lon bajo el cursor: el mapa es GPS, cualquier punto se puede leer.
function showCursor(x, y) {
  const box = $('cursor');
  if (!home || x === null) { box.style.display = 'none'; return; }
  const [lat, lon] = ne2ll(...toWorld(x, y));
  box.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
  box.style.display = 'block';
}

// Arrastrar, rueda y pellizco (pointer events: mouse y pantalla táctil).
const ptrs = new Map();
let moved = false;
cv.addEventListener('pointerdown', ev => {
  cv.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, { x: ev.offsetX, y: ev.offsetY });
  moved = false;
});
cv.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'mouse') showCursor(ev.offsetX, ev.offsetY);
  const prev = ptrs.get(ev.pointerId);
  if (!prev) return;
  const cur = { x: ev.offsetX, y: ev.offsetY };
  if (ptrs.size === 1) {
    const dx = cur.x - prev.x, dy = cur.y - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) { moved = true; setFollow(false); }
    view.e -= dx / view.s; view.n += dy / view.s;
    requestDraw();
  } else if (ptrs.size === 2) {
    const other = [...ptrs.entries()].find(([id]) => id !== ev.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y);
    const d1 = Math.hypot(cur.x - other.x, cur.y - other.y);
    if (d0 > 0) zoomAt((cur.x + other.x) / 2, (cur.y + other.y) / 2, d1 / d0);
    moved = true;
  }
  ptrs.set(ev.pointerId, cur);
});
cv.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') showCursor(null); });
const up = ev => {
  ptrs.delete(ev.pointerId);
  if (!moved && ptrs.size === 0 && ev.type === 'pointerup') {
    pick(ev.offsetX, ev.offsetY);
    if (ev.pointerType !== 'mouse') showCursor(ev.offsetX, ev.offsetY);   // táctil: al tocar
  }
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomAt(ev.offsetX, ev.offsetY, Math.exp(-ev.deltaY * 0.0015));
}, { passive: false });

$('bFollow').onclick = () => setFollow(!follow);
$('bFit').onclick = () => { setFollow(false); fitAll(); };
$('bIn').onclick = () => zoomAt(W / 2, H / 2, 1.5);
$('bOut').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.5);
$('bOsm').onclick = () => {
  osm = !osm;
  try { localStorage.setItem('mapa_osm', osm ? '1' : '0'); } catch (e) {}
  showOsm();
};
function showOsm() {
  $('bOsm').classList.toggle('on', osm);
  $('attrib').style.display = osm ? 'block' : 'none';
  updateNote();
  requestDraw();
}
function updateNote() {
  const note = $('note');
  const msg = osm && tileFailed ? 'Sin internet: no se puede cargar el mapa de calles. La grilla y las coordenadas siguen siendo válidas.' : '';
  note.textContent = msg;
  note.style.display = msg ? 'block' : 'none';
}

// ---------------------------------------------------------------- tabla
function copyText(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = 'Copiado'; setTimeout(() => btn.textContent = old, 1200); };
  // navigator.clipboard solo existe en https o localhost: desde otra PC por
  // http://<ip> se usa el método viejo.
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text) && done());
  } else if (fallbackCopy(text)) done();
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

// Detectadas por id y después las marcas manuales (M1, M2...: id -1, -2...).
const sortedPersons = () => (state ? [...state.persons].sort((a, b) =>
  (a.manual - b.manual) || (a.manual ? b.id - a.id : a.id - b.id)) : []);
const hora = t => new Date(t * 1000).toLocaleTimeString();

function toDrone(p) {
  const dr = live && live.ne;
  if (!dr || !p.pos) return '';
  const dn = p.pos[0] - dr[0], de = p.pos[1] - dr[1];
  return `${fmtDist(Math.hypot(dn, de))} · ${deg3(bearing(dn, de))}`;
}

function renderStats() {
  const persons = state ? state.persons.filter(p => !p.manual) : [];   // las del detector
  const ubic = persons.filter(p => p.ubicada).length;
  $('nTotal').textContent = persons.length;
  $('nUbic').textContent = ubic;
  $('nAprox').textContent = persons.length - ubic;
  $('nView').textContent = live && live.in_view != null ? live.in_view : '–';
  document.title = persons.length ? `(${persons.length}) Mapa de rescate` : 'Mapa de rescate';
}

function renderRows() {
  const persons = sortedPersons();
  let html;
  if (!persons.length) {
    html = '<tr class="empty"><td colspan="8">Todavía no se encontró a nadie.</td></tr>';
  } else {
    html = persons.map(p => {
      const cls = [p.id === selected ? 'sel' : '', fresh.has(p.id) ? 'new' : ''].join(' ');
      if (p.manual) {
        const coords = `${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`;
        return `<tr class="${cls}" data-id="${p.id}" title="Marca manual: posición del dron cuando se apretó Marcar aquí.">
          <td><b>${esc(p.etiqueta)}</b></td><td><span class="badge manual">Manual</span></td>
          <td class="mono">${p.lat.toFixed(6)}</td><td class="mono">${p.lon.toFixed(6)}</td>
          <td class="muted">dron</td><td>${esc(toDrone(p))}</td><td class="muted">${esc(hora(p.t))}</td>
          <td><button data-copy="${coords}" title="Copiar latitud, longitud">Copiar</button>
              <button data-del="${p.id}" title="Borrar esta marca manual">Borrar</button></td></tr>`;
      }
      if (!p.ubicada) {
        return `<tr class="${cls}" data-id="${p.id}" title="Sin coordenadas de la persona: se marcó donde estaba el dron (${p.drone_lat.toFixed(6)}, ${p.drone_lon.toFixed(6)}). Volver a pasar sobre esa zona.">
          <td><b>${p.id}</b></td><td><span class="badge aprox">Aprox.</span></td>
          <td class="mono muted">${p.drone_lat.toFixed(6)}</td><td class="mono muted">${p.drone_lon.toFixed(6)}</td>
          <td class="muted">dron</td><td class="muted">${esc(toDrone(p))}</td><td class="muted">${esc(hora(p.t))}</td>
          <td><button data-del="${p.id}" title="Borrar este punto">Borrar</button></td></tr>`;
      }
      const coords = `${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`;
      const err = p.error_m != null ? `±${p.error_m.toFixed(1)} m` : '';
      return `<tr class="${cls}" data-id="${p.id}">
        <td><b>${p.id}</b></td><td><span class="badge ubic">GPS</span></td>
        <td class="mono">${p.lat.toFixed(6)}</td><td class="mono">${p.lon.toFixed(6)}</td>
        <td>${esc(err)}</td><td>${esc(toDrone(p))}</td><td class="muted">${esc(hora(p.t))}</td>
        <td><button data-copy="${coords}" title="Copiar latitud, longitud">Copiar</button>
            <button data-del="${p.id}" title="Borrar este punto (p. ej. una falsa alarma)">Borrar</button></td></tr>`;
    }).join('');
  }
  if (html !== lastRows) {               // sin cambios no se rehace: no se pierde el "Copiado"
    $('rows').innerHTML = html;
    lastRows = html;
  }
}

function tableText() {
  const lines = ['#\testado\tlatitud\tlongitud\terror_m\thora'];
  for (const p of sortedPersons()) {
    if (p.manual) {
      lines.push(`${p.etiqueta}\tmanual (dron)\t${p.lat.toFixed(6)}\t${p.lon.toFixed(6)}\t\t${hora(p.t)}`);
      continue;
    }
    lines.push(p.ubicada
      ? `${p.id}\tGPS\t${p.lat.toFixed(6)}\t${p.lon.toFixed(6)}\t${p.error_m ?? ''}\t${hora(p.t)}`
      : `${p.id}\taproximada (dron)\t${p.drone_lat.toFixed(6)}\t${p.drone_lon.toFixed(6)}\t\t${hora(p.t)}`);
  }
  return lines.join('\n');
}
$('bCopyAll').onclick = ev => copyText(tableText(), ev.currentTarget);

$('rows').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-copy]');
  if (btn) { ev.stopPropagation(); copyText(btn.dataset.copy, btn); return; }
  const del = ev.target.closest('button[data-del]');
  if (del) { ev.stopPropagation(); deletePoint(+del.dataset.del); return; }
  const tr = ev.target.closest('tr[data-id]');
  if (!tr) return;
  const p = state.persons.find(q => q.id === +tr.dataset.id);
  select(p.id, false);
  centerOn(p);
});

// ---------------------------------------------------------------- marcas manuales
let toastTimer = null;
function toast(text, bad) {
  const t = $('toast');
  t.textContent = text; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3500);
}
async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify(body || {}) });
  let out = {};
  try { out = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(out.error || ('error ' + r.status));
  return out;
}
const gpsOk = () => live && live.lat != null && live.age_s != null && live.age_s <= 3;
let markPending = false;
async function markHere() {
  const b = $('bMark');
  if (b.disabled || markPending) return;
  markPending = true;
  b.disabled = true;
  try {
    const r = await postJSON('/api/mark');
    toast(`Marca agregada en ${r.lat.toFixed(6)}, ${r.lon.toFixed(6)}`);
    setTimeout(refreshState, 300);                // aparece sin esperar el próximo segundo
  } catch (e) {
    toast('No se pudo marcar: ' + e.message, true);
  }
  setTimeout(() => { markPending = false; b.disabled = !gpsOk(); }, 600);   // evita dobles clics
}
async function deletePoint(id) {
  const p = state && state.persons.find(q => q.id === id);
  if (!p) return;
  const what = p.manual ? `la marca ${p.etiqueta}`
    : `el punto #${p.id} (${p.ubicada ? 'GPS' : 'aproximado'}) del detector`;
  if (!confirm(`¿Borrar ${what}?\nNo se puede deshacer.`)) return;
  try {
    await postJSON('/api/mark/delete', p.manual ? { id } : { id, t: p.t });
    toast(`Borrado: ${what}`);
    if (selected === id) select(null, false);
    setTimeout(refreshState, 300);
  } catch (e) { toast('No se pudo borrar: ' + e.message, true); }
}
$('bDel').onclick = () => { if (selected !== null) deletePoint(selected); };
$('bMark').onclick = markHere;
window.addEventListener('keydown', ev => {
  if ((ev.key === 'm' || ev.key === 'M') && !ev.ctrlKey && !ev.metaKey && !ev.altKey
      && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) markHere();
  if ((ev.key === 'Delete' || ev.key === 'Supr') && selected !== null
      && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) deletePoint(selected);
});

// ---------------------------------------------------------------- datos
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(url + ': ' + r.status);
  return r.json();
}

function onState(s) {
  state = s;
  home = s.home;
  const now = performance.now();
  for (const p of s.persons) {
    if (!known.has(p.id)) {
      if (gotState) fresh.set(p.id, now);   // las que ya estaban al abrir la página, no
      known.add(p.id);
    }
  }
  gotState = true;
  if (selected !== null && !s.persons.some(p => p.id === selected)) select(null, false);
  if (home && !fitted && W) { fitted = true; follow ? setFollow(true) : fitAll(); }
  renderStats();
  renderRows();
  requestDraw();
}

function onLive() {
  if (live.ne && follow) { view.n = live.ne[0]; view.e = live.ne[1]; }
  const d = $('drone');
  if (live.lat == null) d.textContent = 'Dron: sin GPS';
  else {
    const alt = live.alt_rel != null ? ` · ${live.alt_rel.toFixed(1)} m` : '';
    const hdg = live.heading_deg != null ? ` · rumbo ${deg3(live.heading_deg)}` : '';
    d.textContent = `Dron: ${live.lat.toFixed(6)}, ${live.lon.toFixed(6)}${alt}${hdg}`;
  }
  if (!markPending) $('bMark').disabled = !gpsOk();
  renderStats();
  requestDraw();
}

function updateStatus() {
  const st = $('status'), now = Date.now();
  let cls, txt;
  if (now - lastLiveOk > 3000 || now - lastStateOk > 5000) { cls = 'bad'; txt = 'Sin conexión'; }
  else if (!live || live.lat == null || live.age_s > 3) { cls = 'warn'; txt = 'Sin GPS del dron'; }
  else { cls = 'ok'; txt = 'En vivo'; }
  st.className = cls; st.textContent = txt;
  for (const [id, t0] of fresh) {                      // las nuevas destacan 10 s
    if (performance.now() - t0 > 10000) fresh.delete(id);
  }
  renderRows();                                        // distancia al dron y destacadas
}

async function refreshState() {
  try { onState(await getJSON('/api/state')); lastStateOk = Date.now(); }
  catch (e) { /* sin conexión: updateStatus lo muestra */ }
}
async function pollState() {
  await refreshState();
  setTimeout(pollState, 1000);
}
async function pollLive() {
  try { live = await getJSON('/api/live'); lastLiveOk = Date.now(); onLive(); }
  catch (e) {}
  setTimeout(pollLive, 250);
}

window.addEventListener('resize', resize);
resize();
showOsm();
setInterval(updateStatus, 1000);
pollState();
pollLive();
</script>
</body>
